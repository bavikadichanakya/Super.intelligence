<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Three.js 5s Benchmark</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #07090e;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        background: radial-gradient(circle at 50% 45%, #0f172a 0%, #07090e 100%);
      }
      #three-canvas {
        width: 1080px;
        height: 1920px;
        display: block;
      }
      .hud-header {
        position: absolute;
        top: 220px;
        left: 60px;
        right: 60px;
        text-align: center;
      }
      .hud-title {
        color: #00e5ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
      }
      .hud-sub {
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 24px;
        font-weight: 500;
        margin-top: 10px;
      }
      .hud-footer {
        position: absolute;
        bottom: 240px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .hud-metric {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid #38bdf8;
        color: #38bdf8;
        padding: 12px 30px;
        border-radius: 24px;
        font-size: 26px;
        font-family: "Courier New", Courier, monospace;
        font-weight: 700;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .hud-provenance {
        color: #64748b;
        font-size: 18px;
        font-family: monospace;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="benchmark_threejs_5s"
         data-start="0"
         data-duration="5.00"
         data-width="1080"
         data-height="1920"
         data-fps="30">
      <canvas id="three-canvas" width="1080" height="1920"></canvas>
      <div class="hud-header">
        <div class="hud-title">NEURAL COMPUTE TOPOLOGY</div>
        <div class="hud-sub">Procedural 3D Accelerator Node Lattice</div>
      </div>
      <div class="hud-footer">
        <div class="hud-metric">LATENCY: 1.42 ms · THROUGHPUT: 18.4 TFLOPS</div>
        <div class="hud-provenance">ENGINE: THREE.JS (WEBGL) · ZERO BLENDER DEPENDENCY</div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("three-canvas");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(1080, 1920);
      renderer.setPixelRatio(1);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1080 / 1920, 0.1, 100);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x0f172a, 1.5);
      scene.add(ambientLight);

      const keyLight = new THREE.PointLight(0x00e5ff, 3.5, 30);
      keyLight.position.set(5, 6, 8);
      scene.add(keyLight);

      const fillLight = new THREE.PointLight(0x8b5cf6, 3.0, 30);
      fillLight.position.set(-6, -4, 6);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0xf59e0b, 1.5);
      rimLight.position.set(0, -8, -5);
      scene.add(rimLight);

      // Central Computing Core (Icosahedron + Wireframe)
      const coreGroup = new THREE.Group();
      scene.add(coreGroup);

      const geoInner = new THREE.IcosahedronGeometry(1.6, 1);
      const matInner = new THREE.MeshPhongMaterial({
        color: 0x1e1b4b,
        emissive: 0x0f172a,
        specular: 0x8b5cf6,
        shininess: 90,
        flatShading: true,
        transparent: true,
        opacity: 0.85
      });
      const meshInner = new THREE.Mesh(geoInner, matInner);
      coreGroup.add(meshInner);

      const geoWire = new THREE.IcosahedronGeometry(1.65, 1);
      const matWire = new THREE.MeshBasicMaterial({
        color: 0x00e5ff,
        wireframe: true,
        transparent: true,
        opacity: 0.6
      });
      const meshWire = new THREE.Mesh(geoWire, matWire);
      coreGroup.add(meshWire);

      // Orbiting Token Nodes
      const orbitNodes = [];
      const nodeGeo = new THREE.BoxGeometry(0.28, 0.28, 0.28);
      const nodeMat = new THREE.MeshPhongMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        specular: 0xffffff,
        shininess: 100
      });

      const NUM_NODES = 8;
      for (let i = 0; i < NUM_NODES; i++) {
        const mesh = new THREE.Mesh(nodeGeo, nodeMat);
        const angleOffset = (i / NUM_NODES) * Math.PI * 2;
        const radius = 2.8 + 0.3 * Math.sin(i * 2);
        orbitNodes.push({ mesh, angleOffset, radius, speed: 1.2 + (i % 3) * 0.4 });
        scene.add(mesh);
      }

      // Connecting Synaptic Lines
      const lineMat = new THREE.LineBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.4 });
      const lineGeos = [];
      const lineMeshes = [];
      for (let i = 0; i < NUM_NODES; i++) {
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(1, 1, 1)
        ]);
        const lineMesh = new THREE.Line(lineGeo, lineMat);
        lineGeos.push(lineGeo);
        lineMeshes.push(lineMesh);
        scene.add(lineMesh);
      }

      // Deterministic renderAt function (t in seconds, 0.0 to 5.0)
      function renderAt(t) {
        // Continuous camera push and tilt
        const progress = Math.min(Math.max(t / 5.0, 0), 1);
        const camZ = 7.5 - progress * 2.2;
        const camY = Math.sin(t * 0.7) * 0.8;
        const camX = Math.cos(t * 0.5) * 1.2;
        camera.position.set(camX, camY, camZ);
        camera.lookAt(0, 0, 0);

        // Core rotation
        coreGroup.rotation.y = t * 0.9;
        coreGroup.rotation.x = t * 0.45;
        coreGroup.rotation.z = Math.sin(t * 0.6) * 0.2;

        // Pulse wireframe
        const pulse = 1.0 + Math.sin(t * 4.0) * 0.05;
        meshWire.scale.set(pulse, pulse, pulse);

        // Update orbiting nodes and synaptic lines
        for (let i = 0; i < NUM_NODES; i++) {
          const item = orbitNodes[i];
          const theta = item.angleOffset + t * item.speed;
          const nx = Math.cos(theta) * item.radius;
          const ny = Math.sin(theta * 0.8) * (item.radius * 0.45);
          const nz = Math.sin(theta) * item.radius;
          item.mesh.position.set(nx, ny, nz);
          item.mesh.rotation.x = t * 2;
          item.mesh.rotation.y = t * 3;

          // Update connection line
          const positions = lineGeos[i].attributes.position.array;
          positions[3] = nx;
          positions[4] = ny;
          positions[5] = nz;
          lineGeos[i].attributes.position.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }

      // Deterministic time hooks for HyperFrames
      window.addEventListener("hf-seek", function (e) {
        if (e && e.detail && typeof e.detail.time === "number") {
          renderAt(e.detail.time);
        }
      });

      document.addEventListener("seek", function (e) {
        if (e && e.detail && typeof e.detail.time === "number") {
          renderAt(e.detail.time);
        }
      });

      // Render t=0 initially
      renderAt(0);

      // Fallback for live preview
      let startTime = null;
      function loop(timestamp) {
        if (!startTime) startTime = timestamp;
        const t = ((timestamp - startTime) / 1000) % 5.0;
        renderAt(t);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
